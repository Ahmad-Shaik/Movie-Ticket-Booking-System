<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dolly Movies Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div class="main-container">

  <div class="login-card">

    <h1 class="title">
      DOLLY MOVIES
    </h1>

    <p class="subtitle">
      Neon Movie Ticket Booking
    </p>

    <input
      type="email"
      id="loginEmail"
      class="form-control mb-3"
      placeholder="Enter Email"
    >

    <div class="input-group mb-3">

      <input
        type="password"
        id="loginPassword"
        class="form-control"
        placeholder="Enter Password"
      >

      <button
        type="button"
        id="toggleLoginPassword"
        class="btn btn-outline-info"
      >
        Show
      </button>

    </div>

    <button
      type="button"
      id="loginBtn"
      class="btn neon-btn w-100 mb-3"
    >
      Login
    </button>

    <a
      href="register.html"
      class="btn neon-btn-green w-100"
    >
      Create Account
    </a>

  </div>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
