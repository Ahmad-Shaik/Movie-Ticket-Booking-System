<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doll Movies | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card bg-dark border-cyan p-4 shadow-lg">
                <h2 class="neon-text-cyan text-center mb-4">DOLL MOVIES</h2>
                <div id="auth-form">
                    <input type="email" id="email" class="form-control mb-3 bg-black text-white border-magenta" placeholder="Email">
                    <input type="password" id="password" class="form-control mb-3 bg-black text-white border-magenta" placeholder="Password">
                    <button id="login-btn" class="btn btn-outline-cyan w-100 mb-2">Login</button>
                    <button id="signup-btn" class="btn btn-outline-magenta w-100">Register</button>
                    <hr class="border-cyan">
                    <p class="small text-center text-muted">Admin? Use your registered admin credentials.</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
