<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Tickets | Doll Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-light">
    <div class="container mt-4">
        <h1 class="neon-text-cyan text-center">DOLL MOVIES BOOKING</h1>
        <div class="row mt-5">
            <div class="col-md-4">
                <label>Select Movie:</label>
                <select id="movie-select" class="form-select bg-dark text-white border-magenta mb-4">
                    </select>
                <div class="p-3 border-neon">
                    <p>Seats: <span id="count" class="text-cyan">0</span></p>
                    <p>Total: $<span id="total" class="text-magenta">0</span></p>
                    <button id="book-btn" class="btn btn-outline-cyan w-100">Confirm Booking</button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="screen">SCREEN</div>
                <div id="seat-container" class="d-flex flex-wrap justify-content-center"></div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
