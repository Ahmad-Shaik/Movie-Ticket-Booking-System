<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seat Booking</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

<div class="container py-4">

  <!-- TOP BAR -->

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="title">
      🎟 Seat Booking
    </h2>

    <a
      href="./dashboard.html"
      class="btn neon-btn"
    >
      Back
    </a>

  </div>

  <!-- MOVIE INFO -->

  <div
    class="neon-card p-4 mb-4"
    id="movieInfo"
  >

    <h3 class="text-center">
      Loading Movie...
    </h3>

  </div>

  <!-- DATE + TIME -->

  <div class="neon-card p-4 mb-4">

    <div class="row">

      <div class="col-md-6 mb-3">

        <label class="form-label">
          Select Date
        </label>

        <input
          type="date"
          id="bookingDate"
          class="form-control neon-input"
        >

      </div>

      <div class="col-md-6 mb-3">

        <label class="form-label">
          Show Time
        </label>

        <input
          type="time"
          id="bookingTime"
          class="form-control neon-input"
          readonly
        >

      </div>

    </div>

  </div>

  <!-- SCREEN -->

  <div class="text-center mb-4">

    <div class="screen">
      SCREEN
    </div>

  </div>

  <!-- SEATS -->

  <div
    id="seatContainer"
    class="seat-container mb-4"
  ></div>

  <!-- LEGEND -->

  <div class="d-flex gap-4 justify-content-center mb-4 flex-wrap">

    <div class="d-flex align-items-center gap-2">

      <div class="seat available"></div>

      <span class="text-light">
        Available
      </span>

    </div>

    <div class="d-flex align-items-center gap-2">

      <div class="seat selected"></div>

      <span class="text-light">
        Selected
      </span>

    </div>

    <div class="d-flex align-items-center gap-2">

      <div class="seat booked"></div>

      <span class="text-light">
        Booked
      </span>

    </div>

  </div>

  <!-- SUMMARY -->

  <div class="neon-card p-4 mb-4">

    <h4 class="neon-heading mb-3">
      Booking Summary
    </h4>

    <p>
      Selected Seats:
      <span id="selectedSeatsText">
        None
      </span>
    </p>

    <p>
      Total Price:
      ₹<span id="totalPrice">
        0
      </span>
    </p>

  </div>

  <!-- PAYMENT -->

  <div class="neon-card p-4 mb-5">

    <h4 class="neon-heading mb-3">
      UPI Payment
    </h4>

    <div class="text-center mb-4">

      <img
        id="qrCode"
        src=""
        alt="QR"
        class="img-fluid rounded"
        style="
          max-width:250px;
        "
      >

    </div>

    <h5
      class="text-center mb-4"
      id="upiText"
    >
      Loading UPI...
    </h5>

    <button
      class="btn neon-btn-green w-100"
      id="confirmBookingBtn"
    >
      Confirm Booking
    </button>

  </div>

</div>

<script
  type="module"
  src="./js/booking.js"
></script>

</body>
</html>
