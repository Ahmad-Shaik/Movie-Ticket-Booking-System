<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Tickets | Doll Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="neon-text-cyan">DOLL MOVIES</h1>
            <a href="index.html" class="btn btn-sm btn-outline-danger">Logout</a>
        </div>

        <div class="row mt-5">
            <div class="col-md-4">
                <label class="mb-2">Select Movie:</label>
                <select id="movie-select" class="form-select bg-dark text-white border-magenta mb-4">
                    <option value="0">Loading movies...</option>
                </select>
                <div class="p-3 border-cyan bg-dark shadow-neon">
                    <p>Seats Selected: <span id="count" class="text-cyan">0</span></p>
                    <p>Total Price: $<span id="total" class="text-magenta">0</span></p>
                    <button id="book-btn" class="btn btn-outline-cyan w-100">Confirm Booking</button>
                </div>
            </div>
            <div class="col-md-8 text-center">
                <div class="screen mb-4">SCREEN</div>
                <div id="seat-container" class="d-flex flex-wrap justify-content-center" style="max-width: 450px; margin: auto;">
                    </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
