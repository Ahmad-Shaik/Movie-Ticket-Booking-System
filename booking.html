<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dolly Movies Booking</title>

  <!-- Bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->

  <link rel="stylesheet" href="./css/style.css">

</head>

<body class="neon-body">

  <div class="container py-5">

    <div class="neon-card p-4">

      <!-- TOP BAR -->

      <div class="d-flex justify-content-between align-items-center mb-4">

        <!-- BACK BUTTON -->

        <button class="btn neon-btn" onclick="history.back()">

          ← Back

        </button>

        <!-- PAGE TITLE -->

        <h3 class="neon-heading m-0">

          Movie Booking

        </h3>

      </div>

      <!-- MOVIE DETAILS -->

      <div id="movieDetails"></div>

      <hr class="text-light">

      <!-- DATE SELECT -->

      <div class="mb-4">

        <label class="form-label text-light fs-5">

          🎟 Select Date

        </label>

        <select id="dateSelect" class="form-select neon-input"></select>

      </div>

      <!-- SHOW SELECT -->

      <div class="mb-4">

        <label class="form-label text-light fs-5">

          🎬 Select Show

        </label>

        <select id="showSelect" class="form-select neon-input"></select>

      </div>

      <!-- SCREEN -->

      <div class="screen-container text-center mb-5">

        <div class="screen">

          SCREEN THIS WAY

        </div>

      </div>

      <!-- SEAT LEGEND -->

      <div class="d-flex justify-content-center gap-4 flex-wrap mb-4">

        <div class="text-light">

          <button class="btn btn-success btn-sm"></button>

          Selected

        </div>

        <div class="text-light">

          <button class="btn btn-danger btn-sm"></button>

          Booked

        </div>

        <div class="text-light">

          <button class="btn btn-outline-light btn-sm"></button>

          Available

        </div>

      </div>

      <!-- SEATS -->

      <div id="seatContainer" class="mb-5"></div>

      <!-- TIMER -->

      <div class="alert alert-warning text-center" id="seatTimer" style="display:none;">

        ⏳ Seats locked for:
        <span id="timerText">

          05:00

        </span>

      </div>

      <!-- PAYMENT SECTION -->

      <div class="neon-card p-4 mt-4" id="paymentSection" style="display:none;">

        <h3 class="neon-heading text-center mb-4">

          💳 Complete Payment

        </h3>

        <!-- QR -->

        <div class="text-center">

          <img id="upiQr" style="
              width:250px;
              height:250px;
              background:white;
              padding:10px;
              border-radius:20px;
            ">

        </div>

        <!-- PAYMENT DETAILS -->

        <div class="text-center mt-4">

          <h4 class="text-light mb-3">

            Total Amount:
            ₹<span id="totalAmountText">

              0

            </span>

          </h4>

          <button class="btn neon-btn" id="verifyPaymentBtn">

            Payment Completed

          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- QR CODE -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- PDF -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- BOOKING JS -->

  <script type="module" src="./js/booking.js"></script>

</body>

</html>
