<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card p-4 shadow">

        <h2 class="text-center mb-4">User Register</h2>

        <input type="text" id="name" class="form-control mb-3" placeholder="Full Name">

        <input type="email" id="email" class="form-control mb-3" placeholder="Email">

        <input type="text" id="phone" class="form-control mb-3" placeholder="Phone Number">

        <textarea id="address" class="form-control mb-3" placeholder="Address"></textarea>

        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password">
          <button class="btn btn-outline-secondary" id="togglePassword">
            Show
          </button>
        </div>

        <button class="btn btn-primary w-100" id="registerBtn">
          Register
        </button>

        <p class="mt-3 text-center">
          Already have account?
          <a href="index.html">Login</a>
        </p>

      </div>

    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
