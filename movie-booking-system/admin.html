<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-3 bg-dark p-4 min-vh-100">

                <h2 class="mb-4">Admin Panel</h2>

                <button class="btn btn-primary w-100 mb-3" id="showMovieForm">
                    Add Movie
                </button>

                <button class="btn btn-success w-100 mb-3" id="showPaymentForm">
                    Payment Settings
                </button>

                <button class="btn btn-danger w-100" id="logoutBtn">
                    Logout
                </button>

            </div>

            <div class="col-md-9 p-4">

                <script type="module" src="js/admin.js"></script>
                <div class="row" id="moviesContainer"></div>

            </div>

        </div>

    </div>

    <script type="module" src="js/admin.js"></script>

</body>

</html>
