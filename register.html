<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-dark">

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card p-4 shadow">

        <h2 class="text-center mb-4">
          Create Account
        </h2>

        <input
          type="text"
          id="name"
          class="form-control mb-3"
          placeholder="Name"
        >

        <input
          type="email"
          id="email"
          class="form-control mb-3"
          placeholder="Email"
        >

        <input
          type="text"
          id="phone"
          class="form-control mb-3"
          placeholder="Phone"
        >

        <textarea
          id="address"
          class="form-control mb-3"
          placeholder="Address"
        ></textarea>

        <div class="input-group mb-3">

          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password"
          >

          <button
            type="button"
            class="btn btn-outline-secondary"
            id="togglePassword"
          >
            Show
          </button>

        </div>

        <button
          type="button"
          class="btn btn-success w-100 mb-3"
          id="registerBtn"
        >
          Register
        </button>

        <a
          href="index.html"
          class="btn btn-primary w-100"
        >
          Back To Login
        </a>

      </div>

    </div>

  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
