<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dolly Movies Register</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div class="main-container">

  <div class="login-card">

    <h1 class="title">
      CREATE ACCOUNT
    </h1>

    <input
      type="text"
      id="name"
      class="form-control mb-3"
      placeholder="Name"
    >

    <input
      type="email"
      id="email"
      class="form-control mb-3"
      placeholder="Email"
    >

    <input
      type="text"
      id="phone"
      class="form-control mb-3"
      placeholder="Phone"
    >

    <textarea
      id="address"
      class="form-control mb-3"
      placeholder="Address"
    ></textarea>

    <div class="input-group mb-3">

      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="Password"
      >

      <button
        type="button"
        id="togglePassword"
        class="btn btn-outline-info"
      >
        Show
      </button>

    </div>

    <button
      type="button"
      id="registerBtn"
      class="btn neon-btn-green w-100 mb-3"
    >
      Register
    </button>

    <a
      href="index.html"
      class="btn neon-btn w-100"
    >
      Back To Login
    </a>

  </div>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
