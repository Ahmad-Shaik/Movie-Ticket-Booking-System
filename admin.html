<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dolly Movies Admin</title>

  <!-- BOOTSTRAP -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body class="neon-body">

<div class="container-fluid">

  <div class="row min-vh-100">

    <!-- SIDEBAR -->

    <div class="col-lg-2 col-md-3 sidebar p-4">

      <h2 class="neon-heading mb-4">
        👑 ADMIN PANEL
      </h2>

      <div class="neon-card p-3 text-center mb-4">

        <h5
          id="adminName"
          class="m-0 text-light"
        >
          👑 ADMIN
        </h5>

      </div>

      <button
        class="btn btn-danger w-100"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

    <!-- MAIN -->

    <div class="col-lg-10 col-md-9 p-4">

      <!-- TITLE -->

      <h1 class="neon-heading mb-4">
        🎬 Movie Management
      </h1>

      <!-- ADD / UPDATE MOVIE -->

      <div class="neon-card p-4 mb-5">

        <h3 class="neon-heading mb-4">
          ➕ Add / Update Movie
        </h3>

        <div class="row">

          <!-- MOVIE NAME -->

          <div class="col-md-6 mb-3">

            <label class="form-label text-light">
              Movie Name
            </label>

            <input
              type="text"
              id="movieName"
              class="form-control neon-input"
              placeholder="Movie Name"
            >

          </div>

          <!-- POSTER -->

          <div class="col-md-6 mb-3">

            <label class="form-label text-light">
              Poster URL
            </label>

            <input
              type="text"
              id="posterUrl"
              class="form-control neon-input"
              placeholder="Poster URL"
            >

          </div>

          <!-- PLACE -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Place Name
            </label>

            <input
              type="text"
              id="place"
              class="form-control neon-input"
              placeholder="Place"
            >

          </div>

          <!-- THEATER -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Theater Name
            </label>

            <input
              type="text"
              id="theater"
              class="form-control neon-input"
              placeholder="Theater"
            >

          </div>

          <!-- PRICE -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Ticket Price
            </label>

            <input
              type="number"
              id="ticketPrice"
              class="form-control neon-input"
              placeholder="Ticket Price"
            >

          </div>

          <!-- ROWS -->

          <div class="col-md-3 mb-3">

            <label class="form-label text-light">
              Rows
            </label>

            <input
              type="number"
              id="rows"
              class="form-control neon-input"
            >

          </div>

          <!-- COLS -->

          <div class="col-md-3 mb-3">

            <label class="form-label text-light">
              Columns
            </label>

            <input
              type="number"
              id="cols"
              class="form-control neon-input"
            >

          </div>

          <!-- WALKWAY -->

          <div class="col-md-3 mb-3">

            <label class="form-label text-light">
              Walkway Type
            </label>

            <select
              id="walkwayType"
              class="form-select neon-input"
            >

              <option value="vertical">
                Vertical
              </option>

              <option value="horizontal">
                Horizontal
              </option>

            </select>

          </div>

          <!-- WALKWAY AFTER -->

          <div class="col-md-3 mb-3">

            <label class="form-label text-light">
              Walkway After Seats
            </label>

            <input
              type="number"
              id="walkwayAfter"
              class="form-control neon-input"
              placeholder="5"
            >

          </div>

          <!-- SHOW DATE -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Movie Release Date
            </label>

            <input
              type="date"
              id="showDate"
              class="form-control neon-input"
            >

          </div>

          <!-- SHOW TIME -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Show Time
            </label>

            <input
              type="time"
              id="showTime"
              class="form-control neon-input"
            >

          </div>

          <!-- BOOKING OPEN -->

          <div class="col-md-4 mb-3">

            <label class="form-label text-light">
              Booking Opens Before (Days)
            </label>

            <input
              type="number"
              id="bookingOpenDays"
              class="form-control neon-input"
              value="1"
            >

          </div>

        </div>

        <!-- BUTTON -->

        <button
          class="btn neon-btn w-100 mt-3"
          id="addMovieBtn"
        >
          Add Movie
        </button>

      </div>

      <!-- UPI SETTINGS -->

      <div class="neon-card p-4 mb-5">

        <h3 class="neon-heading mb-4">
          💳 UPI Settings
        </h3>

        <div class="row">

          <div class="col-md-6 mb-3">

            <label class="form-label text-light">
              UPI ID
            </label>

            <input
              type="text"
              id="upiId"
              class="form-control neon-input"
              placeholder="example@upi"
            >

          </div>

          <div class="col-md-6 mb-3">

            <label class="form-label text-light">
              Account Holder Name
            </label>

            <input
              type="text"
              id="upiName"
              class="form-control neon-input"
              placeholder="Name"
            >

          </div>

        </div>

        <button
          class="btn btn-success w-100"
          id="saveUpiBtn"
        >
          Save UPI Settings
        </button>

      </div>

      <!-- MOVIES -->

      <h2 class="neon-heading mb-4">
        🎥 Added Movies
      </h2>

      <div
        class="row mb-5"
        id="moviesContainer"
      ></div>

      <!-- USERS -->

      <h2 class="neon-heading mb-4">
        👥 Registered Users
      </h2>

      <div class="table-responsive neon-card p-3 mb-5">

        <table class="table table-dark table-bordered align-middle">

          <thead>

            <tr>

              <th>Name</th>

              <th>Email</th>

              <th>Phone</th>

              <th>Address</th>

              <th>Role</th>

            </tr>

          </thead>

          <tbody id="usersTableBody"></tbody>

        </table>

      </div>

      <!-- BOOKINGS -->

      <h2 class="neon-heading mb-4">
        🎟 Booking Data
      </h2>

      <div class="table-responsive neon-card p-3">

        <table class="table table-dark table-bordered align-middle">

          <thead>

            <tr>

              <th>User</th>

              <th>Movie</th>

              <th>Theater</th>

              <th>Seats</th>

              <th>Date</th>

              <th>Time</th>

              <th>Amount</th>

            </tr>

          </thead>

          <tbody id="bookingsTableBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<!-- SCRIPT -->

<script
  type="module"
  src="./js/admin.js"
></script>

</body>
</html>
