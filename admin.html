<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

<div class="container-fluid">

  <div class="row min-vh-100">

    <!-- SIDEBAR -->

    <div class="col-md-3 col-lg-2 sidebar p-4">

      <h2 class="title mb-4">
        🎬 ADMIN
      </h2>

      <button
        class="btn neon-btn w-100 mb-3"
        id="moviesTabBtn"
      >
        Movie Management
      </button>

      <button
        class="btn neon-btn w-100 mb-3"
        id="usersTabBtn"
      >
        Users Data
      </button>

      <button
        class="btn neon-btn w-100 mb-3"
        id="upiTabBtn"
      >
        UPI Settings
      </button>

      <button
        class="btn btn-danger w-100"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

    <!-- MAIN CONTENT -->

    <div class="col-md-9 col-lg-10 p-4">

      <!-- MOVIE SECTION -->

      <div id="moviesSection">

        <!-- ADD MOVIE CARD -->

        <div class="neon-card p-4 mb-4">

          <h3 class="mb-4 neon-heading">
            Add Movie
          </h3>

          <div class="row">

            <!-- MOVIE NAME -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Movie Name
              </label>

              <input
                type="text"
                id="movieName"
                class="form-control neon-input"
                placeholder="Enter Movie Name"
              >

            </div>

            <!-- POSTER URL -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Poster URL
              </label>

              <input
                type="text"
                id="posterUrl"
                class="form-control neon-input"
                placeholder="Enter Poster URL"
              >

            </div>

            <!-- PLACE -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Place
              </label>

              <input
                type="text"
                id="place"
                class="form-control neon-input"
                placeholder="Enter Place"
              >

            </div>

            <!-- THEATER -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Theater Name
              </label>

              <input
                type="text"
                id="theater"
                class="form-control neon-input"
                placeholder="Enter Theater Name"
              >

            </div>

            <!-- TICKET PRICE -->

            <div class="col-md-4 mb-3">

              <label class="form-label">
                Ticket Price
              </label>

              <input
                type="number"
                id="ticketPrice"
                class="form-control neon-input"
                placeholder="Enter Ticket Price"
              >

            </div>

            <!-- ROWS -->

            <div class="col-md-4 mb-3">

              <label class="form-label">
                Rows
              </label>

              <input
                type="number"
                id="rows"
                class="form-control neon-input"
                placeholder="Enter Rows"
              >

            </div>

            <!-- COLUMNS -->

            <div class="col-md-4 mb-3">

              <label class="form-label">
                Columns
              </label>

              <input
                type="number"
                id="cols"
                class="form-control neon-input"
                placeholder="Enter Columns"
              >

            </div>

            <!-- WALKWAY -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Walkway After Seats
              </label>

              <input
                type="number"
                id="walkwayAfter"
                class="form-control neon-input"
                placeholder="Example: 4"
              >

            </div>

            <!-- WALKWAY TYPE -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Walkway Type
              </label>

              <select
                id="walkwayType"
                class="form-control neon-input"
              >

                <option value="vertical">
                  Vertical Walkway
                </option>

                <option value="horizontal">
                  Horizontal Walkway
                </option>

              </select>

            </div>

            <!-- START DATE -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Movie Start Date
              </label>

              <input
                type="date"
                id="startDate"
                class="form-control neon-input"
              >

            </div>

            <!-- SHOW TIME -->

            <div class="col-md-6 mb-3">

              <label class="form-label">
                Show Time
              </label>

              <input
                type="time"
                id="showTime"
                class="form-control neon-input"
              >

            </div>

          </div>

          <button
            class="btn neon-btn-green"
            id="addMovieBtn"
          >
            Add Movie
          </button>

        </div>

        <!-- MOVIES -->

        <div
          class="row"
          id="moviesContainer"
        ></div>

      </div>

      <!-- USERS SECTION -->

      <div
        id="usersSection"
        style="display:none;"
      >

        <div class="neon-card p-4">

          <h3 class="neon-heading mb-4">
            Registered Users
          </h3>

          <div class="table-responsive">

            <table
              class="table table-dark table-bordered"
            >

              <thead>

                <tr>

                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>

                </tr>

              </thead>

              <tbody id="usersTable"></tbody>

            </table>

          </div>

        </div>

      </div>

      <!-- UPI SECTION -->

      <div
        id="upiSection"
        style="display:none;"
      >

        <div class="neon-card p-4">

          <h3 class="neon-heading mb-4">
            UPI Payment Settings
          </h3>

          <div class="mb-3">

            <label class="form-label">
              UPI ID
            </label>

            <input
              type="text"
              id="upiId"
              class="form-control neon-input"
              placeholder="Enter UPI ID"
            >

          </div>

          <div class="mb-3">

            <label class="form-label">
              Account Holder Name
            </label>

            <input
              type="text"
              id="upiName"
              class="form-control neon-input"
              placeholder="Enter Holder Name"
            >

          </div>

          <button
            class="btn neon-btn-green"
            id="saveUpiBtn"
          >
            Save UPI Settings
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<script
  type="module"
  src="./js/admin.js"
></script>

</body>
</html>
