<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

  <div class="container-fluid">

    <div class="row min-vh-100">

      <!-- SIDEBAR -->

      <div class="col-md-3 col-lg-2 sidebar p-4">

        <h2 class="title mb-4">
          🎬 ADMIN
        </h2>

        <div class="admin-user mb-4">

          <h5 id="adminName">
            👑 ADMIN
          </h5>

        </div>

        <button class="btn neon-btn w-100 mb-3" id="moviesTabBtn">
          Movie Management
        </button>

        <button class="btn neon-btn w-100 mb-3" id="usersTabBtn">
          Users Data
        </button>

        <button class="btn neon-btn w-100 mb-3" id="upiTabBtn">
          UPI Settings
        </button>

        <button class="btn btn-danger w-100" id="logoutBtn">
          Logout
        </button>

      </div>

      <!-- CONTENT -->

      <div class="col-md-9 col-lg-10 p-4">

        <!-- MOVIE SECTION -->

        <div class="card p-4 mb-4">

          <h3 class="mb-4">
            Add Movie
          </h3>

          <div class="row">

            <div class="col-md-6 mb-3">

              <input type="text" id="movieName" class="form-control" placeholder="Movie Name">

            </div>

            <div class="col-md-6 mb-3">

              <input type="text" id="posterUrl" class="form-control" placeholder="Poster URL">

            </div>

            <div class="col-md-6 mb-3">

              <input type="text" id="place" class="form-control" placeholder="Place">

            </div>

            <div class="col-md-6 mb-3">

              <input type="text" id="theater" class="form-control" placeholder="Theater Name">

            </div>

            <div class="col-md-4 mb-3">

              <input type="number" id="ticketPrice" class="form-control" placeholder="Ticket Price">

            </div>

            <div class="col-md-4 mb-3">

              <input type="number" id="rows" class="form-control" placeholder="Rows">

            </div>

            <div class="col-md-4 mb-3">

              <input type="number" id="cols" class="form-control" placeholder="Columns">

            </div>

            <!-- WALKWAY AFTER -->

            <div class="col-md-6 mb-3">

              <input type="number" id="walkwayAfter" class="form-control" placeholder="Walkway After Seats">

            </div>

            <!-- WALKWAY TYPE -->

            <div class="col-md-6 mb-3">

              <select id="walkwayType" class="form-control">

                <option value="vertical">
                  Vertical Walkway
                </option>

                <option value="horizontal">
                  Horizontal Walkway
                </option>

              </select>

            </div>

            <!-- START DATE -->

            <div class="col-md-6 mb-3">

              <input type="date" id="startDate" class="form-control">

            </div>

            <!-- SHOW TIME -->

            <div class="col-md-6 mb-3">

              <input type="time" id="showTime" class="form-control">

            </div>

          </div>

          <button class="btn neon-btn-green" id="addMovieBtn">
            Add Movie
          </button>

        </div>

        <!-- MOVIES -->

        <div class="row" id="moviesContainer"></div>

      </div>

      <!-- USERS SECTION -->

      <div id="usersSection" style="display:none;">

        <div class="card p-4">

          <h3 class="mb-4">
            Registered Users
          </h3>

          <div class="table-responsive">

            <table class="table table-dark table-bordered">

              <thead>

                <tr>

                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>

                </tr>

              </thead>

              <tbody id="usersTable"></tbody>

            </table>

          </div>

        </div>

      </div>

      <!-- UPI SECTION -->

      <div id="upiSection" style="display:none;">

        <div class="card p-4">

          <h3 class="mb-4">
            UPI Payment Settings
          </h3>

          <input type="text" id="upiId" class="form-control mb-3" placeholder="UPI ID">

          <input type="text" id="upiName" class="form-control mb-3" placeholder="UPI Holder Name">

          <button class="btn neon-btn-green" id="saveUpiBtn">
            Save UPI Settings
          </button>

        </div>

      </div>

    </div>

  </div>

  </div>

  <script type="module" src="./js/admin.js"></script>

</body>

</html>
