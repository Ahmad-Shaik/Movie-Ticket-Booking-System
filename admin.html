<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Manage Doll Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-light">
    <nav class="navbar border-bottom border-magenta mb-4">
        <div class="container">
            <span class="navbar-brand neon-text-magenta">ADMIN PANEL</span>
            <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
        </div>
    </nav>
    <div class="container">
        <div class="card bg-dark border-magenta p-4">
            <h3 class="neon-text-cyan">Add New Movie</h3>
            <div class="row g-3">
                <div class="col-md-6"><input type="text" id="movie-name" class="form-control bg-black text-white border-cyan" placeholder="Movie Title"></div>
                <div class="col-md-4"><input type="number" id="movie-price" class="form-control bg-black text-white border-cyan" placeholder="Price ($)"></div>
                <div class="col-md-2"><button id="add-movie" class="btn btn-outline-magenta w-100">Publish</button></div>
            </div>
        </div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
