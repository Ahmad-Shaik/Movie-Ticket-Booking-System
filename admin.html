<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dolly Movies Admin</title>

  <!-- BOOTSTRAP -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body class="neon-body">

<div class="container-fluid">

  <div class="row min-vh-100">

    <!-- SIDEBAR -->

    <div class="col-lg-2 col-md-3 sidebar p-4">

      <h2 class="neon-heading mb-5">
        🎬 DOLLY
      </h2>

      <div class="d-flex flex-column gap-3">

        <a
          href="#movieSection"
          class="btn neon-btn"
        >
          Add / Update Movie
        </a>

        <a
          href="#upiSection"
          class="btn neon-btn"
        >
          UPI Settings
        </a>

        <a
          href="#usersSection"
          class="btn neon-btn"
        >
          Registered Users
        </a>

        <a
          href="#bookingSection"
          class="btn neon-btn"
        >
          Booking Data
        </a>

      </div>

    </div>

    <!-- MAIN -->

    <div class="col-lg-10 col-md-9 p-4">

      <!-- TOP BAR -->

      <div class="d-flex justify-content-between align-items-center mb-5">

        <h1 class="neon-heading">
          👑 ADMIN PANEL
        </h1>

        <button
          class="btn btn-danger"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>

      <!-- ADD MOVIE -->

      <section id="movieSection">

        <div class="neon-card p-4 mb-5">

          <h3 class="neon-heading mb-4">
            ➕ Add / Update Movie
          </h3>

          <div class="row">

            <!-- MOVIE NAME -->

            <div class="col-md-6 mb-3">

              <label class="form-label text-light">
                Movie Name
              </label>

              <input
                type="text"
                id="movieName"
                class="form-control neon-input"
              >

            </div>

            <!-- POSTER -->

            <div class="col-md-6 mb-3">

              <label class="form-label text-light">
                Poster URL
              </label>

              <input
                type="text"
                id="posterUrl"
                class="form-control neon-input"
              >

            </div>

            <!-- PLACE -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Place Name
              </label>

              <input
                type="text"
                id="place"
                class="form-control neon-input"
              >

            </div>

            <!-- THEATER -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Theater Name
              </label>

              <input
                type="text"
                id="theater"
                class="form-control neon-input"
              >

            </div>

            <!-- PRICE -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Ticket Price
              </label>

              <input
                type="number"
                id="ticketPrice"
                class="form-control neon-input"
              >

            </div>

            <!-- ROWS -->

            <div class="col-md-3 mb-3">

              <label class="form-label text-light">
                Rows
              </label>

              <input
                type="number"
                id="rows"
                class="form-control neon-input"
              >

            </div>

            <!-- COLS -->

            <div class="col-md-3 mb-3">

              <label class="form-label text-light">
                Columns
              </label>

              <input
                type="number"
                id="cols"
                class="form-control neon-input"
              >

            </div>

            <!-- WALKWAY -->

            <div class="col-md-3 mb-3">

              <label class="form-label text-light">
                Walkway Type
              </label>

              <select
                id="walkwayType"
                class="form-select neon-input"
              >

                <option value="vertical">
                  Vertical
                </option>

                <option value="horizontal">
                  Horizontal
                </option>

              </select>

            </div>

            <!-- WALKWAY AFTER -->

            <div class="col-md-3 mb-3">

              <label class="form-label text-light">
                Walkway After Seats
              </label>

              <input
                type="number"
                id="walkwayAfter"
                class="form-control neon-input"
              >

            </div>

            <!-- DATE -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Release Date
              </label>

              <input
                type="date"
                id="showDate"
                class="form-control neon-input"
              >

            </div>

            <!-- TIME -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Show Time
              </label>

              <input
                type="time"
                id="showTime"
                class="form-control neon-input"
              >

            </div>

            <!-- BOOKING DAYS -->

            <div class="col-md-4 mb-3">

              <label class="form-label text-light">
                Booking Opens Before
              </label>

              <input
                type="number"
                id="bookingOpenDays"
                class="form-control neon-input"
                value="1"
              >

            </div>

          </div>

          <button
            class="btn neon-btn w-100 mt-3"
            id="addMovieBtn"
          >
            Add Movie
          </button>

        </div>

      </section>

      <!-- UPI -->

      <section id="upiSection">

        <div class="neon-card p-4 mb-5">

          <h3 class="neon-heading mb-4">
            💳 UPI Settings
          </h3>

          <div class="row">

            <div class="col-md-6 mb-3">

              <label class="form-label text-light">
                UPI ID
              </label>

              <input
                type="text"
                id="upiId"
                class="form-control neon-input"
              >

            </div>

            <div class="col-md-6 mb-3">

              <label class="form-label text-light">
                Account Holder Name
              </label>

              <input
                type="text"
                id="upiName"
                class="form-control neon-input"
              >

            </div>

          </div>

          <button
            class="btn btn-success w-100"
            id="saveUpiBtn"
          >
            Save UPI Settings
          </button>

        </div>

      </section>

      <!-- USERS -->

      <section id="usersSection">

        <div class="neon-card p-4 mb-5">

          <h3 class="neon-heading mb-4">
            👥 Registered Users
          </h3>

          <div class="table-responsive">

            <table class="table table-dark table-bordered">

              <thead>

                <tr>

                  <th>Name</th>

                  <th>Email</th>

                  <th>Phone</th>

                  <th>Address</th>

                </tr>

              </thead>

              <tbody id="usersTableBody"></tbody>

            </table>

          </div>

        </div>

      </section>

      <!-- BOOKINGS -->

      <section id="bookingSection">

        <div class="neon-card p-4">

          <h3 class="neon-heading mb-4">
            🎟 Booking Data
          </h3>

          <div class="table-responsive">

            <table class="table table-dark table-bordered">

              <thead>

                <tr>

                  <th>User</th>

                  <th>Movie</th>

                  <th>Theater</th>

                  <th>Seats</th>

                  <th>Date</th>

                  <th>Time</th>

                  <th>Amount</th>

                </tr>

              </thead>

              <tbody id="bookingsTableBody"></tbody>

            </table>

          </div>

        </div>

      </section>

    </div>

  </div>

</div>

<script
  type="module"
  src="./js/admin.js"
></script>

</body>
</html>
