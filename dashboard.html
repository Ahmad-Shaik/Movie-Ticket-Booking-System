<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dolly Movies</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/style.css"
  >

</head>

<body>

<div class="container-fluid py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="title">
      🎬 DOLLY MOVIES
    </h1>

    <button
      id="logoutBtn"
      class="btn neon-btn"
    >
      Logout
    </button>

  </div>

  <div class="card p-4 mb-4">

    <input
      type="text"
      id="searchInput"
      class="form-control mb-3"
      placeholder="Search Movies..."
    >

    <div class="row">

      <div class="col-md-6 mb-3">

        <select
          id="placeFilter"
          class="form-control"
        >
          <option value="">
            Select Place
          </option>
        </select>

      </div>

      <div class="col-md-6 mb-3">

        <select
          id="theaterFilter"
          class="form-control"
        >
          <option value="">
            Select Theater
          </option>
        </select>

      </div>

    </div>

  </div>

  <div
    class="row"
    id="moviesContainer"
  ></div>

</div>

<script
  type="module"
  src="./js/dashboard.js"
></script>

</body>
</html>
